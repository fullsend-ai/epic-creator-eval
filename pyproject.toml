[build-system]
requires = ["uv_build>=0.9.3,<1"]
build-backend = "uv_build"

[project]
name = "epic-creator-eval"
version = "0.1.0"
description = "Evaluation orchestration for the Epic Creator agent"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
    "pre-commit>=3.5.0",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
