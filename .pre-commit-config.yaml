repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (Python type checking)
        entry: uv run mypy src/
        language: system
        files: '^src/.*\.py$'
        pass_filenames: false
